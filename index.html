<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças 360</title>
<style>
/* Layout: sidebar + conteúdo; hero escuro como único ponto de ousadia, o resto fica sóbrio */
:root{
  --bg:#F1F2EE;--surface:#FFFFFF;--surface-2:#F6F7F4;--ink:#0F1A2E;--ink-2:#47526A;--muted:#7C869C;
  --line:#E2E4DD;--line-2:#EEF0EA;
  --accent:#2F4BFF;--accent-ink:#FFFFFF;--accent-soft:#E8ECFF;
  --hero-a:#0F1A30;--hero-b:#1D2F63;--hero-ink:#F3F5FB;--hero-mute:#A9B4D2;
  --good:#0B7A3B;--good-bg:#E1F3E8;--warn:#8F5A00;--warn-bg:#FFF0D3;--bad:#BF2F2F;--bad-bg:#FDE6E6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
  --shadow:0 1px 2px rgba(15,26,46,.05),0 8px 24px rgba(15,26,46,.05);
  --f-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,'Segoe UI',Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B101B;--surface:#141B2B;--surface-2:#192238;--ink:#EDF0F7;--ink-2:#B3BCD0;--muted:#8791A6;
    --line:#252F47;--line-2:#1E2740;--accent:#8CA0FF;--accent-ink:#0B101B;--accent-soft:#1F2A55;
    --hero-a:#131E3D;--hero-b:#25397A;--good:#46C27A;--good-bg:#12301F;--warn:#F0B54A;--warn-bg:#3A2D10;
    --bad:#FF7A7A;--bad-bg:#3B1A1D;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B101B;--surface:#141B2B;--surface-2:#192238;--ink:#EDF0F7;--ink-2:#B3BCD0;--muted:#8791A6;
  --line:#252F47;--line-2:#1E2740;--accent:#8CA0FF;--accent-ink:#0B101B;--accent-soft:#1F2A55;
  --hero-a:#131E3D;--hero-b:#25397A;--good:#46C27A;--good-bg:#12301F;--warn:#F0B54A;--warn-bg:#3A2D10;
  --bad:#FF7A7A;--bad-bg:#3B1A1D;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{flex:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;max-height:100dvh;overflow:auto;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand small{font-weight:600;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sync{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 8px;display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)}.sync.err i{background:var(--bad)}
.bnav{display:none}
main{overflow-x:clip;padding:28px clamp(16px,3vw,40px) 80px;max-width:1180px;width:100%;margin:0 auto}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:22px}
.head h1{font-size:clamp(26px,3.4vw,34px);line-height:1.1}
.head p{color:var(--ink-2);margin-top:4px}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mnav button{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--ink-2)}
.mnav button:hover{background:var(--surface-2)}
.mnav span{min-width:140px;text-align:center;font-weight:600;padding:0 6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.ibtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--ink-2)}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2 small{font:500 13px var(--f-body);color:var(--muted)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.sect{margin-top:30px}
.sect>h2{font-size:19px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}

/* Hero */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:24px;padding:28px clamp(18px,3vw,34px);display:grid;gap:22px;box-shadow:0 14px 40px rgba(15,26,46,.22)}
.hero .eyebrow{color:var(--hero-mute)}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;align-items:flex-end}
.hero-total{font:800 clamp(38px,6vw,60px)/1 var(--f-display);letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-weight:600;font-size:14px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hero-stats div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.hero-stats b{display:block;font:700 clamp(16px,2.2vw,21px) var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:12.5px;color:var(--hero-mute)}
.pbar{height:10px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;display:flex}
.pbar i{display:block;height:100%;background:#fff}
.hero-bottom{display:grid;gap:10px}
.stack{display:flex;gap:2px;height:12px;border-radius:99px;overflow:hidden}
.stack i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.hero .legend{color:var(--hero-mute)}

/* Cartões (visual) */
.ccard{position:relative;border-radius:20px;padding:18px;color:#fff;display:grid;gap:14px;text-align:left;overflow:hidden;min-height:196px;box-shadow:0 10px 26px rgba(15,26,46,.18);transition:transform .15s}
.ccard:hover{transform:translateY(-2px)}
.ccard::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09)}
.ccard.sel{outline:3px solid var(--accent);outline-offset:3px}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.cc-name{font:700 17px var(--f-display)}
.cc-bank{font-size:12.5px;opacity:.8}
.cc-val{font:800 28px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.cc-sub{font-size:12.5px;opacity:.85;margin-top:5px}
.cc-limit{position:relative;z-index:1;font-size:12.5px}
.cc-limit .pbar{height:7px;margin:6px 0 5px;background:rgba(255,255,255,.25)}
.cc-limit div:last-child{display:flex;justify-content:space-between;opacity:.9}
.cc-add{border:2px dashed var(--line);border-radius:20px;min-height:196px;display:grid;place-items:center;color:var(--ink-2);font-weight:600;gap:6px;text-align:center;padding:16px}
.cc-add:hover{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.ccard .pill{background:rgba(255,255,255,.2);color:#fff}

/* Linhas */
.list{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row.is-paid .row-name{text-decoration:line-through;color:var(--muted)}
.row.is-paid .row-amt{color:var(--muted)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk:hover{border-color:var(--good)}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk.none{border:0;background:var(--surface-2);color:var(--muted);cursor:default}
.row-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;margin-top:2px}
.row-meta .late{color:var(--bad);font-weight:600}
.row-amt{font:700 16px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:100%;z-index:30;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 34px rgba(15,26,46,.2);display:none}
.menu-wrap.open .menu{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;text-align:left;font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu .danger{color:var(--bad)}
.empty{padding:30px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:4px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font:700 clamp(18px,2.4vw,23px) var(--f-display);margin-top:3px;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:none;outline:0;padding:10px 0;width:100%;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel,.fld select,.fld input,.fld textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0}
select.sel{width:auto;padding:8px 12px}
.fld input:focus,.fld select:focus,.fld textarea:focus,select.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:20px}

/* Barras e gráficos */
.hb{display:grid;gap:12px}
.hb-row{display:grid;gap:5px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hb-top b{font-variant-numeric:tabular-nums}
.hb-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:99px}
.bars{position:relative;height:230px;display:grid;grid-template-columns:44px 1fr;margin-top:8px}
.bars .yl{position:relative;font-size:11.5px;color:var(--muted)}
.bars .yl span{position:absolute;right:8px;transform:translateY(50%)}
.bars .plot{position:relative;display:flex;gap:6px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.bars .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.bcol{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bstack{width:min(34px,78%);display:flex;flex-direction:column-reverse;gap:2px;border-radius:5px 5px 0 0;overflow:hidden}
.bstack i{display:block;min-height:2px}
.bcol.fut .bstack{opacity:.5}
.blab{position:absolute;bottom:-24px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.bcol.cur .blab{color:var(--ink);font-weight:700}
.bcol:hover .bstack{filter:brightness(1.1)}
.donut{display:grid;grid-template-columns:minmax(150px,190px) 1fr;gap:20px;align-items:center}
.donut svg{width:100%;height:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line-2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ai-box{background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-top:12px;line-height:1.55}
.ai-box ul{padding-left:18px;display:grid;gap:6px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(8,12,22,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal h2{font-size:22px;margin-bottom:4px}
.modal .sub{color:var(--muted);margin-bottom:16px;font-size:14px}
.form{display:grid;gap:14px}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lab{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.segs{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,26,46,.15)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.inline{display:flex;gap:8px}
.inline select{flex:1}
.hint{font-size:13px;color:var(--muted)}
.preview{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-line}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;flex-wrap:wrap}
.opt{display:grid;gap:2px;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:14px}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-weight:700}.opt span{font-size:13.5px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer}
.sw span{display:block;width:32px;height:32px;border-radius:10px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sw input:checked+span{border-color:var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw.card span{width:52px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px}
.toggle input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:.15s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:21px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row .l{display:flex;align-items:center;gap:10px;min-width:0}
.set-row .l div{min-width:0}
.set-row .l b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.set-row .l span{font-size:13px;color:var(--muted)}
.actions-row{display:flex;flex-wrap:wrap;gap:8px}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:13px;white-space:pre-line;max-width:260px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:300;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1020px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:10px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  main{padding-top:18px}
  #toast{bottom:84px}
}
@media (max-width:640px){
  .cards-row{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cards-row::-webkit-scrollbar{display:none}
  .cards-row>*{flex:0 0 84%;max-width:330px;scroll-snap-align:center}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .donut{grid-template-columns:1fr}.donut svg{max-width:190px;margin:0 auto}

const MN = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- dinheiro ---------- */
const _fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = n => _fmt.format(Math.round((n || 0) * 100) / 100);

const compact = n => n >= 1000 ? (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : String(Math.round(n));
function parseMoney(v) {
  let s = String(v ?? '').replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');

}
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

/* ---------- estado ---------- */
function defState() {
  return { v: 1, name: '', theme: 'auto', ai: true, demo: false, cats: DEFAULT_CATS.map(c => ({ ...c })),
    accounts: [], cards: [], plans: [], inv: {}, recv: [], learned: {} };
}
let S = defState();
const U = { view: 'central', month: todayStr().slice(0, 7), cardSel: null,
  fExp: { q: '', status: 'all', cat: '', kind: '', inv: true }, fRecv: { status: 'pend', q: '' }, tbl: false, ai: { busy: false, text: '', err: '' } };

const catById = id => S.cats.find(c => c.id === id) || { id: 'x', name: 'Sem categoria', color: '#94a3b8' };
const cardById = id => S.cards.find(c => c.id === id);
const planById = id => S.plans.find(p => p.id === id);

/* ---------- categorização local (palavras-chave) e aprendida ---------- */
const KW = {
  moradia: ['aluguel','condominio','iptu','reforma','moveis','imobiliaria'],
  contas: ['luz','energia','enel','cemig','cpfl','agua','sabesp','gas','internet','vivo','claro','tim','oi','telefone','celular','fibra','copasa'],
  mercado: ['mercado','supermercado','atacadao','carrefour','assai','extra','pao de acucar','hortifruti','feira','sacolao','acougue','atacarejo'],
  alimentacao: ['ifood','restaurante','lanche','pizza','padaria','cafe','burger','mcdonalds','rappi','delivery','acai','sorvete','churrasco','almoco','jantar'],
  transporte: ['uber','99','gasolina','combustivel','posto','estacionamento','pedagio','onibus','metro','ipva','seguro auto','oficina','mecanico','sem parar','licenciamento'],
  saude: ['farmacia','drogasil','droga raia','consulta','medico','plano de saude','unimed','dentista','exame','academia','gympass','smartfit','psicologo','hospital','remedio'],

  assinaturas: ['netflix','spotify','prime','disney','hbo','max','youtube','icloud','google one','globoplay','deezer','chatgpt','claude','assinatura','apple','paramount'],
  compras: ['amazon','mercado livre','shopee','magalu','shein','americanas','loja','roupa','tenis','zara','renner','casas bahia','notebook','celular novo','eletronico'],
  viagem: ['passagem','hotel','airbnb','latam','gol','azul','booking','viagem','hospedagem','decolar'],
  pets: ['pet','racao','veterinario','petz','cobasi','banho e tosa'],
  cuidados: ['salao','cabelo','barbearia','manicure','estetica','perfume','boticario','natura','depilacao'],

};
function guessCat(name) {
  const n = norm(name); if (n.length < 2) return null;
  if (S.learned[n] && S.cats.some(c => c.id === S.learned[n])) return S.learned[n];
  const padded = ' ' + n + ' ';
  for (const [cid, words] of Object.entries(KW)) {
    if (!S.cats.some(c => c.id === cid)) continue;
    for (const w of words) { if (padded.includes(' ' + w + ' ') || (w.length >= 5 && n.includes(w))) return cid; }
  }
  return null;
}

/* ---------- parcelas, fixas e únicas: geração de ocorrências ---------- */
function invoiceMonth(card, dateStr) { return +dateStr.slice(8, 10) > card.closeDay ? addM(dateStr.slice(0, 7), 1) : dateStr.slice(0, 7); }
function bucketFor(dateStr, cardId) { const c = cardId && cardById(cardId); return c ? invoiceMonth(c, dateStr) : dateStr.slice(0, 7); }
function planBase(p) { const baseCal = p.date.slice(0, 7); return { baseCal, baseBucket: bucketFor(p.date, p.cardId) }; }
function dueDate(c, m) { return c.dueDay > c.closeDay ? clampDate(m, c.dueDay) : clampDate(addM(m, 1), c.dueDay); }

function occOf(p, m) {
  const { baseCal, baseBucket } = planBase(p);
  const k = diffM(m, baseBucket);
  if (k < 0) return null;
  if (p.kind === 'single') { if (k !== 0) return null; }
  else if (p.kind === 'fixed') { if (p.endMonth && diffM(m, p.endMonth) > 0) return null; }
  else if (k > p.n - p.first) return null;
  const ov = (p.ov && p.ov[m]) || {};
  if (ov.del) return null;
  const date = ov.date || clampDate(addM(baseCal, k), +p.date.slice(8, 10));
  const paid = p.cardId ? (S.inv[p.cardId + '|' + m] || null) : ((p.paid && p.paid[m]) || null);
  return { pid: p.id, m, k, kind: p.kind, inst: p.kind === 'installment' ? p.first + k : null, n: p.n || null,
    name: ov.name ?? p.name, cat: ov.cat ?? p.cat, amount: ov.amount ?? p.amount, date, paid,
    cardId: p.cardId || null, accId: p.accId || null, one: !!(p.ov && p.ov[m]) };
}
function occs(m) { const out = []; for (const p of S.plans) { const o = occOf(p, m); if (o) out.push(o); } return out; }

function invoicesFrom(occ, m) {
  const t = todayStr();
  return S.cards.map(c => {
    const items = occ.filter(o => o.cardId === c.id);
    const total = sum(items, o => o.amount);
    const paid = S.inv[c.id + '|' + m] || null;
    const close = clampDate(m, c.closeDay), due = dueDate(c, m);
    const cur = invoiceMonth(c, t);
    const status = paid ? 'paga' : diffM(m, cur) > 0 ? 'futura' : total === 0 ? 'vazia' : t > due ? 'vencida' : t > close ? 'fechada' : 'aberta';
    return { card: c, m, items, total, paid, close, due, status };
  });
}
function limitUsed(card) {
  const t = todayStr(), cur = invoiceMonth(card, t); let used = 0;
  for (const p of S.plans) {
    if (p.cardId !== card.id) continue;
    const { baseBucket } = planBase(p);
    const last = p.kind === 'installment' ? addM(baseBucket, p.n - p.first) : p.kind === 'single' ? baseBucket : (p.endMonth && diffM(p.endMonth, cur) < 0 ? p.endMonth : cur);
    let m = baseBucket, g = 0;
    while (diffM(m, last) <= 0 && g++ < 400) {
      const future = diffM(m, cur) > 0;
      if (future && p.kind !== 'installment') break;
      const o = occOf(p, m);
      if (o && !(!future && S.inv[card.id + '|' + m])) used += o.amount;
      m = addM(m, 1);
    }
  }
  return used;
}
function summary(m) {
  const t = todayStr(), occ = occs(m), acc = occ.filter(o => !o.cardId), invs = invoicesFrom(occ, m);
  const accTotal = sum(acc, o => o.amount), accPaid = sum(acc.filter(o => o.paid), o => o.amount);
  const cardTotal = sum(invs, i => i.total), cardPaid = sum(invs.filter(i => i.paid), i => i.total);
  const overdue = sum(acc.filter(o => !o.paid && o.date < t), o => o.amount) + sum(invs.filter(i => !i.paid && i.total > 0 && i.due < t), i => i.total);
  const byCat = {}, byKind = { fixed: 0, installment: 0, single: 0 };
  occ.forEach(o => { byCat[o.cat] = (byCat[o.cat] || 0) + o.amount; byKind[o.kind] += o.amount; });
  return { m, occ, acc, invs, accTotal, accPaid, cardTotal, cardPaid, total: accTotal + cardTotal, paid: accPaid + cardPaid,

}

function occOfIn(state, p, m) { const keep = S; S = state; try { return occOf(p, m); } finally { S = keep; } }

/* ---------- persistência: nuvem (db privado do usuário) + navegador ---------- */
const CAP = { db: null, doc: null, sample: null, dl: null, loaded: false, sync: 'local' };
let _saveT = null, _writing = false, _dirty = false;
function save() {

  _dirty = true; clearTimeout(_saveT); _saveT = setTimeout(flush, 700);
}
async function flush() {
  if (!CAP.doc || !CAP.loaded) return;
  if (_writing) { _saveT = setTimeout(flush, 500); return; }
  _writing = true; _dirty = false;
  try { await CAP.doc.set({ json: JSON.stringify(S), t: Date.now() }); setSync('ok'); } catch (e) { setSync('err'); }
  _writing = false; if (_dirty) flush();
}
function setSync(s) { CAP.sync = s; if (typeof document === 'undefined') return; const el = document.getElementById('sync'); if (!el) return;
  el.className = 'sync ' + (s === 'ok' ? 'ok' : s === 'err' ? 'err' : ''); el.querySelector('span').textContent = s === 'ok' ? 'Salvo na sua conta' : s === 'err' ? 'Erro ao salvar na nuvem' : 'Salvo neste navegador'; }

/* ---------- IA ---------- */
async function askJson(prompt) {

  if (typeof sm.json === 'function') return await sm.json(prompt, { modelTier: 'quick', cache: false });
  const r = await sm(prompt, { modelTier: 'quick', cache: false }); const m = String(r.text).match(/[\[{][\s\S]*[\]}]/); return JSON.parse(m ? m[0] : r.text);
}
async function aiCategorize(names) {
  const cats = S.cats.map(c => ({ id: c.id, nome: c.name }));
  const prompt = 'Você classifica despesas pessoais de um brasileiro. Categorias disponíveis (use somente estes ids): ' + JSON.stringify(cats) +
    '. Para cada descrição escolha o id da categoria mais adequada. Responda SOMENTE com um array JSON, na mesma ordem das descrições: [{"nome":"...","cat":"id"}]. Descrições: ' + JSON.stringify(names);
  const r = await askJson(prompt); const arr = Array.isArray(r) ? r : (r && r.itens) || [];
  return names.map((n, i) => { const id = arr[i] && arr[i].cat; return S.cats.some(c => c.id === id) ? id : null; });
}

/* ---------- Despesas ---------- */

  return out.filter(x => (!q || norm(x.name).includes(q)) && (f.status === 'all' || (f.status === 'pend' && !x.paid) || (f.status === 'paid' && x.paid) || (f.status === 'late' && x.late)) &&
    (!f.cat || x.cat === f.cat) && (!f.kind || x.kind === f.kind)).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.name.localeCompare(b.name));

    <div class="plot">${ticks.slice(1).map(k => `<div class="gl" style="bottom:calc(${k * 100}% * (1 - 26/230) + 26px)"></div>`).join('')}
    ${rows.map(r => { const tot = r.acc + r.card, h = tot / nice * 100;

}

}

function updExp(form) {
  if (!form) return; const f = new FormData(form), kind = f.get('kind') || 'single';
  form.querySelectorAll('[data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(kind); });
  const lab = form.querySelector('[data-lbl=date]'), al = form.querySelector('#f-amt-lab'), entry = f.get('entry') || 'parcel';
  if (lab) lab.textContent = kind === 'single' ? 'Data' : kind === 'fixed' ? 'Vencimento (repete todo mês)' : 'Vencimento da parcela atual';
  if (al) al.textContent = kind === 'installment' && !form.dataset.scope.startsWith('one') ? (entry === 'total' ? 'Valor total da compra' : 'Valor de cada parcela') : kind === 'fixed' ? 'Valor mensal' : 'Valor';
  const pv = form.querySelector('#f-prev'); if (!pv || kind !== 'installment') return;
  const amt = parseMoney(f.get('amount')), n = +f.get('n'), inst = +f.get('inst'), date = f.get('date');
  if (!(amt > 0) || !(n >= 2) || !(inst >= 1 && inst <= n) || !validDate(date)) { pv.textContent = 'Informe valor, parcelas e a parcela atual para ver o resumo.'; return; }
  const parcel = entry === 'total' ? r2(amt / n) : amt, total = entry === 'total' ? amt : r2(amt * n), left = n - inst + 1, start = bucketFor(date, form.dataset.card || null);
  pv.textContent = `${n}x de ${brl(parcel)} · total ${brl(total)}\nA partir da parcela ${inst}: faltam ${left} (${brl(parcel * left)}), de ${fmtMonthShort(start)} a ${fmtMonthShort(addM(start, left - 1))}.`;
}

const FORMS = {};
FORMS.expense = form => {
  const d = form.dataset, f = new FormData(form), scope = d.scope, k = +d.k || 0, errEl = $('#f-err'), fail = m => { errEl.textContent = m; errEl.hidden = false; };
  const name = (f.get('name') || '').trim(), cat = f.get('cat'), kind = f.get('kind') || 'single', date = f.get('date');
  let amount = parseMoney(f.get('amount'));
  if (!name) return fail('Informe a descrição da despesa.');
  if (!(amount > 0)) return fail('Informe um valor maior que zero.');
  if (!validDate(date)) return fail('Informe uma data válida.');
  if (f.get('touched') === '1') S.learned[norm(name)] = cat;
  if (scope === 'one') {
    const p = planById(d.pid), m = d.m, ov = { ...(p.ov[m] || {}) }; delete ov.del;
    const defDate = clampDate(addM(planBase(p).baseCal, k), +p.date.slice(8, 10));
    ['name', 'cat', 'amount', 'date'].forEach(x => delete ov[x]);
    if (name !== p.name) ov.name = name; if (cat !== p.cat) ov.cat = cat; if (amount !== p.amount) ov.amount = amount; if (date !== defDate) ov.date = date;
    if (Object.keys(ov).length) p.ov[m] = ov; else delete p.ov[m];
    closeModal(); return commit('Parcela atualizada.');
  }
  let n = 1, first = 1, total = null, entry = 'parcel';
  if (kind === 'installment') {
    n = +f.get('n'); const inst = +f.get('inst'); entry = f.get('entry') || 'parcel';
    if (!(n >= 2 && n <= 480)) return fail('O total de parcelas deve ser de 2 a 480.');
    if (!(inst >= 1 && inst <= n)) return fail('A parcela atual deve estar entre 1 e o total de parcelas.');
    total = entry === 'total' ? amount : r2(amount * n); amount = entry === 'total' ? r2(amount / n) : amount; first = inst - (d.pid ? k : 0);
    if (first < 1) return fail('Com esta parcela atual, o parcelamento começaria antes da parcela 1. Ajuste a parcela ou a data.');
  }
  const baseDate = d.pid && k ? clampDate(addM(date.slice(0, 7), -k), +date.slice(8, 10)) : date;
  const fields = { name, cat, kind, amount, entry, date: baseDate, first, n, total, endMonth: kind === 'fixed' ? (f.get('endMonth') || null) : null, accId: f.get('acc') || null, cardId: f.get('card') || d.card || null };
  const paidNow = f.get('paidNow') === 'on';
  if (!d.pid) {
    const p = { id: uid(), note: '', paid: {}, ov: {}, ...fields };
    if (paidNow && !p.cardId) p.paid[bucketFor(p.date, null)] = todayStr();
    S.plans.push(p); closeModal(); return commit('Despesa adicionada.');
  }
  const p = planById(d.pid), m = d.m;
  if (scope === 'following' && k > 0) {
    const np = { id: uid(), note: p.note || '', paid: {}, ov: {}, ...fields, date };
    p.endMonth = addM(m, -1);
    Object.keys(p.paid || {}).forEach(x => { if (diffM(x, m) >= 0) { np.paid[x] = p.paid[x]; delete p.paid[x]; } });
    Object.keys(p.ov || {}).forEach(x => { if (diffM(x, m) >= 0) { np.ov[x] = p.ov[x]; delete p.ov[x]; } });
    S.plans.push(np);
  } else {
    const oldBucket = bucketFor(p.date, p.cardId);
    Object.assign(p, fields);
    if (p.kind === 'single') { const nb = bucketFor(p.date, p.cardId); p.paid = {}; p.ov = {}; if (paidNow && !p.cardId) p.paid[nb] = todayStr(); }
    else if (!p.cardId && paidNow) { p.paid[m] = p.paid[m] || todayStr(); }
    else if (!p.cardId && !paidNow && p.paid) delete p.paid[m];
    if (bucketFor(p.date, p.cardId) !== oldBucket && p.kind !== 'single') p.paid = p.paid || {};
  }
  closeModal(); commit('Alterações salvas.');
};

async function editOcc(pid, m) {
  const p = planById(pid), o = p && occOf(p, m); if (!o) return; let scope = 'all';
  if (p.kind === 'fixed') scope = await askScope('Editar despesa fixa', o.name, [['one', 'Somente este mês', 'Altera apenas ' + fmtMonth(m) + '.'], ['following', 'Este e os próximos meses', 'Mantém o histórico dos meses anteriores.'], ['all', 'Todos os meses', 'Altera a série inteira, inclusive meses passados.']]);
  else if (p.kind === 'installment') scope = await askScope('Editar parcelamento', `${o.name} · parcela ${o.inst}/${p.n}`, [['one', 'Somente a parcela atual', `Altera só a parcela ${o.inst} (${fmtMonth(m)}).`], ['all', 'Todas as parcelas', 'Altera o parcelamento inteiro: valor, total de parcelas, nome e categoria.']]);
  if (scope) openExpenseForm({ plan: p, occ: o, scope });
}
async function delOcc(pid, m) {
  const p = planById(pid), o = p && occOf(p, m); if (!o) return; let scope = 'all';
  if (p.kind === 'fixed') scope = await askScope('Excluir despesa fixa', o.name, [['one', 'Somente este mês', 'Remove apenas ' + fmtMonth(m) + '.'], ['following', 'Este e os próximos meses', 'Encerra a despesa a partir deste mês.'], ['all', 'Todos os meses', 'Exclui a série inteira.']]);
  else if (p.kind === 'installment') scope = await askScope('Excluir parcelamento', `${o.name} · parcela ${o.inst}/${p.n}`, [['one', 'Somente a parcela atual', `Remove só a parcela ${o.inst} (${fmtMonth(m)}).`], ['all', 'Todas as parcelas', 'Exclui o parcelamento inteiro.']]);
  else if (!(await confirmDlg('Excluir despesa?', `"${o.name}" será removida.`, 'Excluir', true))) return; else scope = 'all';
  if (!scope) return;
  if (scope === 'one') { p.ov[m] = { ...(p.ov[m] || {}), del: true }; }
  else if (scope === 'following' && o.k > 0) { p.endMonth = addM(m, -1); }
  else S.plans = S.plans.filter(x => x.id !== pid);
  commit('Despesa excluída.');
}

  },
  newAcc: () => openAccForm(), editAcc: d => openAccForm(S.accounts.find(a => a.id === d.id)),
  delAcc: async d => { if (await confirmDlg('Excluir conta?', 'As despesas vinculadas continuam, apenas sem conta.', 'Excluir', true)) { S.accounts = S.accounts.filter(a => a.id !== d.id); S.plans.forEach(p => { if (p.accId === d.id) p.accId = null; }); commit('Conta excluída.'); } },
  dismissSync: () => { U.syncDismiss = true; render(); },
  clearDemo: async () => { if (await confirmDlg('Começar do zero?', 'Os dados de exemplo serão apagados. Categorias padrão são mantidas.', 'Começar do zero')) { const keep = { name: S.name, theme: S.theme, ai: S.ai }; S = { ...defState(), ...keep }; commit('Tudo limpo. Cadastre seu primeiro cartão ou despesa.'); } },
  loadDemo: async () => { if (await confirmDlg('Carregar exemplo?', 'Isto substitui os dados atuais pelos dados de exemplo.', 'Carregar')) { S = demoState(); commit('Exemplo carregado.'); } },
  resetAll: async () => { if (await confirmDlg('Apagar tudo?', 'Todos os lançamentos, cartões, contas e registros serão removidos. Não dá para desfazer.', 'Apagar tudo', true)) { S = defState(); commit('Dados apagados.'); } },
  exportJson: async () => saveFile('financas360-backup-' + todayStr() + '.json', JSON.stringify(S, null, 2)),
  exportCsv: async () => {
    const m = U.month, occ = occs(m), q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [['Tipo', 'Descrição', 'Categoria', 'Vencimento', 'Valor', 'Situação', 'Origem'].map(q).join(';')];
    occ.sort((a, b) => a.date < b.date ? -1 : 1).forEach(o => rows.push([o.kind === 'installment' ? `Parcela ${o.inst}/${o.n}` : o.kind === 'fixed' ? 'Fixa' : 'Única', o.name, catById(o.cat).name, fmtDfull(o.date), String(o.amount).replace('.', ','), o.paid ? 'Paga' : 'Pendente', o.cardId ? cardById(o.cardId)?.name || 'Cartão' : (S.accounts.find(a => a.id === o.accId)?.name || 'Conta')].map(q).join(';')));
    saveFile('financas360-despesas-' + m + '.csv', '﻿' + rows.join('\n'));
  },
  copyJson: async () => { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copiado para a área de transferência.'); } catch (e) { toast('Não foi possível copiar. Use o botão de backup.'); } },
  aiCat: async () => {
    const form = $('form[data-form=expense]'), name = form.elements.name.value.trim(), btn = $('[data-act=aiCat]', form); if (name.length < 2) return toast('Digite a descrição primeiro.');
    if (!CAP.sample || !S.ai) { const g = guessCat(name); if (g) { form.cat.value = g; $('#f-hint').textContent = 'Categoria sugerida pelas regras locais.'; } else toast('IA indisponível neste ambiente.'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try { const [id] = await aiCategorize([name]); if (id) { form.cat.value = id; form.touched.value = '0'; $('#f-hint').textContent = 'Categoria sugerida pela IA.'; } else toast('A IA não encontrou uma categoria.'); }
    catch (e) { toast(e && e.code === 'not_granted' ? 'Permissão de IA não concedida.' : 'Não foi possível usar a IA agora.'); }
    btn.disabled = false; btn.innerHTML = ic('spark', 16) + ' IA';
  },
  aiRecat: async () => {
    const list = S.plans.filter(p => p.cat === 'outros'); if (!list.length) return toast('Nenhuma despesa em "Outros".');
    const names = [...new Set(list.map(p => p.name))].slice(0, 80);
    try { toast('Categorizando com IA…'); const ids = await aiCategorize(names); let n = 0; names.forEach((nm, i) => { if (ids[i] && ids[i] !== 'outros') { list.filter(p => p.name === nm).forEach(p => { p.cat = ids[i]; n++; }); S.learned[norm(nm)] = ids[i]; } }); commit(n ? `${n} lançamento${n === 1 ? '' : 's'} recategorizado${n === 1 ? '' : 's'}.` : 'A IA manteve tudo em "Outros".'); }
    catch (e) { toast('Não foi possível usar a IA agora.'); }
  },
  aiInsights: async () => {
    if (U.ai.busy || !CAP.sample) return; const { s, rows, avg, commit: cm } = statsFor(U.month);
    const data = { mes: fmtMonth(U.month), total: s.total, pago: s.paid, emAtraso: s.overdue, contas: s.accTotal, cartoes: s.cardTotal, mediaSeisMesesAnteriores: Math.round(avg), comprometidoProximosSeisMeses: Math.round(cm),
      categorias: topCats(s.byCat, 8).map(c => ({ nome: c.name, valor: c.v })), tipos: s.byKind, evolucao: rows.map(r => ({ mes: r.m, total: Math.round(r.tot) })),
      limites: S.cards.map(c => ({ cartao: c.name, usado: Math.round(limitUsed(c)), limite: c.limit })), aReceber: Math.round(sum(S.recv.filter(r => !r.done), r => r.amount)) };
    U.ai = { busy: true, text: '', err: '' }; render();
    try { const r = await CAP.sample('Você é um consultor de finanças pessoais brasileiro, direto e gentil. Com base nos dados em JSON abaixo (valores em reais), escreva de 4 a 6 observações curtas e acionáveis em português do Brasil, cada uma em uma linha começando com "- ". Aponte variações relevantes, categorias que pesam, risco de comprometimento futuro, uso de limite e valores a receber. Não invente números que não estejam nos dados e não recomende produtos de investimento. Dados: ' + JSON.stringify(data), { modelTier: 'default', cache: false }); U.ai = { busy: false, text: r.text || '', err: '' }; }
    catch (e) { U.ai = { busy: false, text: '', err: e && e.code === 'not_granted' ? 'A permissão para usar IA não foi concedida.' : e && e.code === 'rate_limited' ? 'Muitas solicitações. Tente de novo em instantes.' : 'Não foi possível gerar a análise agora.' }; }
    render();
  }
};
async function saveFile(name, data) {
  if (!CAP.dl) { try { await navigator.clipboard.writeText(data); toast('Download indisponível aqui. Conteúdo copiado.'); } catch (e) { toast('Download indisponível neste ambiente.'); } return; }
  try { await CAP.dl.save({ filename: name, data }); toast('Arquivo salvo.'); } catch (e) { if (!e || e.code !== 'declined') toast('Não foi possível salvar o arquivo.'); }
}

document.addEventListener('click', e => {
  if (e.target.id === 'bd') return closeModal();
  const t = e.target.closest('[data-act]'); if (!t) { closeMenus(); return; }
  const a = t.dataset.act; if (a !== 'menu') closeMenus();
  if (t.disabled) return; if (ACT[a]) ACT[a](t.dataset, t, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.form === 'delcat') { const id = f.dataset.id, to = new FormData(f).get('to'); S.plans.forEach(p => { if (p.cat === id) p.cat = to; Object.values(p.ov || {}).forEach(o => { if (o.cat === id) o.cat = to; }); }); Object.keys(S.learned).forEach(k => { if (S.learned[k] === id) delete S.learned[k]; }); S.cats = S.cats.filter(c => c.id !== id); closeModal(); return commit('Categoria excluída.'); }
  FORMS[f.dataset.form]?.(f); });
let _gt;
document.addEventListener('input', e => {
  const form = e.target.closest('form[data-form=expense]');
  if (form) { updExp(form); if (e.target.name === 'name' && form.touched.value !== '1') { clearTimeout(_gt); _gt = setTimeout(() => { const g = guessCat(form.elements.name.value); if (g && form.touched.value !== '1') { form.cat.value = g; $('#f-hint').textContent = 'Categoria sugerida automaticamente.'; } }, 250); } return; }
  if (e.target.id === 'q') { U.fExp.q = e.target.value; $('#exp-list').innerHTML = expListHtml(); }
  else if (e.target.id === 'rq') { U.fRecv.q = e.target.value; $('#recv-list').innerHTML = recvListHtml(); }
  else if (e.target.id === 's-name') { S.name = e.target.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target, form = t.closest('form[data-form=expense]');
  if (form) { if (t.name === 'cat') { form.touched.value = '1'; $('#f-hint').textContent = ''; } return updExp(form); }
  if (t.id === 'fcat') { U.fExp.cat = t.value; $('#exp-list').innerHTML = expListHtml(); }
  else if (t.id === 'fkind') { U.fExp.kind = t.value; $('#exp-list').innerHTML = expListHtml(); }
  else if (t.id === 's-theme') { S.theme = t.value; commit(); }
  else if (t.id === 's-ai') { S.ai = t.checked; commit(); }
  else if (t.id === 'importFile' && t.files[0]) { const fr = new FileReader(); fr.onload = async () => { try { const o = JSON.parse(fr.result); if (!o || !Array.isArray(o.plans)) throw 0; if (await confirmDlg('Importar backup?', 'Os dados atuais serão substituídos pelos do arquivo.', 'Importar')) { S = migrate(o); commit('Backup importado.'); } } catch (er) { toast('Arquivo inválido. Use um backup do Finanças 360.'); } }; fr.readAsText(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#bd')) closeModal(); else closeMenus(); } });
document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { const el = tip(); el.textContent = t.dataset.tip; el.classList.add('on'); } });
document.addEventListener('pointermove', e => { const el = tip(); if (!el.classList.contains('on')) return; const w = el.offsetWidth; el.style.left = Math.min(innerWidth - w - 8, Math.max(8, e.clientX + 14)) + 'px'; el.style.top = Math.max(8, e.clientY - el.offsetHeight - 12) + 'px'; });
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('[data-tip]')) tip().classList.remove('on'); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v) && v !== U.view) { U.view = v; render(); window.scrollTo(0, 0); } });

/* ---------- inicialização ---------- */
function boot() {
  try { const raw = localStorage.getItem(LS); S = raw ? migrate(JSON.parse(raw)) : demoState(); } catch (e) { S = demoState(); }
  const h = location.hash.slice(1); if (VIEWS.some(x => x[0] === h)) U.view = h;
  render(); initCaps();
}
async function initCaps() {
  if (!window.claude || !window.claude.use) { CAP.loaded = true; render(); return; }
  window.claude.use('sample').then(s => { CAP.sample = s || null; if (CAP.sample) render(); }).catch(() => {});
  window.claude.use('downloads').then(d => { CAP.dl = d || null; }).catch(() => {});
  try {
    const db = await window.claude.use('db'), user = await window.claude.use('user'), id = user && await user.id();
    if (!db || !id) { CAP.loaded = true; render(); return; }
    CAP.doc = db.collection('data/users/' + id).doc('finance');
    const snap = await Promise.race([CAP.doc.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    if (snap.exists && snap.data() && snap.data().json) { S = migrate(JSON.parse(snap.data().json)); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} CAP.loaded = true; setSync('ok'); render(); }
    else { CAP.loaded = true; setSync('ok'); await flush(); render(); }
  } catch (e) { CAP.doc = null; CAP.loaded = true; setSync('local'); render(); }
}
if (typeof document !== 'undefined' && document.getElementById('view')) boot();

</script>
